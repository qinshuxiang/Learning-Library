<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" width="720" height="436" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Segoe UI,sans-serif"><defs></defs><rect x="0" y="0" width="720" height="436" fill="#ffffff"/><text x="154.0" y="128" font-size="12.5" text-anchor="middle" fill="#2c3e50" font-weight="700" opacity="1">程序</text><text x="334.0" y="128" font-size="12.5" text-anchor="middle" fill="#2c3e50" font-weight="700" opacity="1">规模</text><text x="490.0" y="122" font-size="12.5" text-anchor="middle" fill="#2c3e50" font-weight="700" opacity="1">批处理（B）或</text><text x="490.0" y="139" font-size="12.5" text-anchor="middle" fill="#2c3e50" font-weight="700" opacity="1">交互式（C）</text><text x="640.0" y="128" font-size="12.5" text-anchor="middle" fill="#2c3e50" font-weight="700" opacity="1">指令／人年</text><line x1="40" y1="154" x2="700" y2="154" stroke="#dde5ed" stroke-width="1" stroke-linecap="butt" opacity="1"/><text x="154.0" y="187" font-size="12.5" text-anchor="middle" fill="#2c3e50" font-weight="600" opacity="1">ESS 代码</text><text x="334.0" y="187" font-size="12.5" text-anchor="middle" fill="#2c3e50" font-weight="600" opacity="1">800,000</text><text x="490.0" y="187" font-size="12.5" text-anchor="middle" fill="#2c3e50" font-weight="600" opacity="1">B</text><text x="640.0" y="187" font-size="12.5" text-anchor="middle" fill="#42b983" font-weight="600" opacity="1">500-1000</text><line x1="40" y1="206" x2="700" y2="206" stroke="#dde5ed" stroke-width="1" stroke-linecap="butt" opacity="1"/><text x="154.0" y="239" font-size="12.5" text-anchor="middle" fill="#2c3e50" font-weight="600" opacity="1">7094 ESS 支持</text><text x="334.0" y="239" font-size="12.5" text-anchor="middle" fill="#2c3e50" font-weight="600" opacity="1">120,000</text><text x="490.0" y="239" font-size="12.5" text-anchor="middle" fill="#2c3e50" font-weight="600" opacity="1">B</text><text x="640.0" y="239" font-size="12.5" text-anchor="middle" fill="#42b983" font-weight="600" opacity="1">2100-3400</text><line x1="40" y1="258" x2="700" y2="258" stroke="#dde5ed" stroke-width="1" stroke-linecap="butt" opacity="1"/><text x="154.0" y="291" font-size="12.5" text-anchor="middle" fill="#2c3e50" font-weight="600" opacity="1">360 ESS 支持</text><text x="334.0" y="291" font-size="12.5" text-anchor="middle" fill="#2c3e50" font-weight="600" opacity="1">32,000</text><text x="490.0" y="291" font-size="12.5" text-anchor="middle" fill="#2c3e50" font-weight="600" opacity="1">C</text><text x="640.0" y="291" font-size="12.5" text-anchor="middle" fill="#42b983" font-weight="600" opacity="1">8000</text><line x1="40" y1="310" x2="700" y2="310" stroke="#dde5ed" stroke-width="1" stroke-linecap="butt" opacity="1"/><text x="154.0" y="343" font-size="12.5" text-anchor="middle" fill="#2c3e50" font-weight="600" opacity="1">360 ESS 支持</text><text x="334.0" y="343" font-size="12.5" text-anchor="middle" fill="#2c3e50" font-weight="600" opacity="1">8,300</text><text x="490.0" y="343" font-size="12.5" text-anchor="middle" fill="#2c3e50" font-weight="600" opacity="1">B</text><text x="640.0" y="343" font-size="12.5" text-anchor="middle" fill="#42b983" font-weight="600" opacity="1">4000</text><rect x="40" y="96" width="660" height="266" rx="0" fill="none" stroke="#c2d1e0" stroke-width="1.4" opacity="1"/><line x1="40" y1="154" x2="700" y2="154" stroke="#c2d1e0" stroke-width="1.4" stroke-linecap="butt" opacity="1"/><rect x="40" y="380" width="400" height="35.5" rx="7" fill="#f2f5f8" stroke="#dde5ed" stroke-width="1" opacity="1"/><text x="50" y="401.0" font-size="11" text-anchor="start" fill="#2c3e50" font-weight="normal" opacity="1">同一系统内，交互式（C）的速率约为批处理（B）的 2 倍</text><rect x="456" y="380" width="244" height="35.5" rx="7" fill="#f2f5f8" stroke="#dde5ed" stroke-width="1" opacity="1"/><text x="466" y="401.0" font-size="11" text-anchor="start" fill="#2c3e50" font-weight="normal" opacity="1">指令／人年为经调试的机器指令</text></svg>