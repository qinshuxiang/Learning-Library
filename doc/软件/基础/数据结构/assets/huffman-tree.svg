<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="哈夫曼树的构造过程与带权路径长度">
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#2c3e50">哈夫曼树：每次合并两个最小权值结点</text>

  <g stroke="#9fb3c8" stroke-width="1.8" fill="none">
    <line x1="290" y1="88" x2="172" y2="160"/>
    <line x1="312" y1="88" x2="452" y2="160"/>
    <line x1="440" y1="186" x2="386" y2="252"/>
    <line x1="470" y1="186" x2="546" y2="252"/>
    <line x1="534" y1="278" x2="490" y2="336"/>
    <line x1="564" y1="278" x2="608" y2="336"/>
  </g>

  <!-- 内部结点 -->
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" text-anchor="middle" font-weight="600">
    <circle cx="301" cy="78" r="24" fill="#fdf5e6" stroke="#e2be74" stroke-width="1.8"/><text x="301" y="83" fill="#9a6b16">16</text>
    <circle cx="450" cy="172" r="22" fill="#fdf5e6" stroke="#e2be74" stroke-width="1.8"/><text x="450" y="177" fill="#9a6b16">9</text>
    <circle cx="552" cy="264" r="20" fill="#fdf5e6" stroke="#e2be74" stroke-width="1.8"/><text x="552" y="269" fill="#9a6b16">5</text>
  </g>

  <!-- 叶子结点 -->
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13.5" text-anchor="middle" font-weight="600">
    <circle cx="158" cy="172" r="26" fill="#eaf7f1" stroke="#7cc6a5" stroke-width="1.8"/><text x="158" y="177" fill="#24674d">7</text>
    <circle cx="378" cy="266" r="24" fill="#eaf7f1" stroke="#7cc6a5" stroke-width="1.8"/><text x="378" y="271" fill="#24674d">4</text>
    <circle cx="480" cy="350" r="24" fill="#eef3fb" stroke="#8fb3e0" stroke-width="1.8"/><text x="480" y="355" fill="#2b5d9e">2</text>
    <circle cx="618" cy="350" r="24" fill="#eef3fb" stroke="#8fb3e0" stroke-width="1.8"/><text x="618" y="355" fill="#2b5d9e">3</text>
  </g>

  <!-- 边标注 0 / 1 -->
  <g font-family="'PingFang SC',sans-serif" font-size="11.5" fill="#8a97a4">
    <text x="216" y="112">0</text>
    <text x="394" y="112">1</text>
    <text x="390" y="226">0</text>
    <text x="520" y="212">1</text>
    <text x="494" y="318">0</text>
    <text x="600" y="316">1</text>
  </g>

  <!-- 右侧构造步骤 -->
  <rect x="384" y="52" width="312" height="118" rx="8" fill="#fbfcfd" stroke="#e3e8ee"/>
  <text x="400" y="74" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#5b6b7b">构造步骤（权值 2、3、4、7）</text>
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12">
    <text x="400" y="98" fill="#5b6b7b">① 合并 2 与 3 → 新结点 5</text>
    <text x="400" y="120" fill="#5b6b7b">② 合并 4 与 5 → 新结点 9</text>
    <text x="400" y="142" fill="#5b6b7b">③ 合并 7 与 9 → 根结点 16</text>
    <text x="400" y="162" fill="#8a97a4">每次取当前最小的两个，直到只剩一棵树</text>
  </g>

  <!-- WPL -->
  <rect x="384" y="186" width="312" height="88" rx="8" fill="#f3fbf7" stroke="#cfeade"/>
  <text x="400" y="210" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#2c6e54">带权路径长度 WPL</text>
  <text x="400" y="234" font-family="'PingFang SC',sans-serif" font-size="12.5" fill="#34495e">WPL = 7×1 + 4×2 + 2×3 + 3×3</text>
  <text x="400" y="256" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#34495e">= 7 + 8 + 6 + 9 = 30，恰等于各内部结点之和</text>

  <text x="170" y="248" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8a97a4">左分支标 0、右分支标 1，</text>
  <text x="170" y="266" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8a97a4">从根到叶的路径即该权值对应的编码</text>
  <text x="170" y="298" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#2b5d9e">7 编码 0，4 编码 10，2 编码 110，3 编码 111</text>

  <text x="360" y="392" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#8a97a4">权值越大的叶离根越近、编码越短；任一编码都不是另一编码的前缀，故译码无歧义</text>
  <text x="360" y="412" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#8a97a4">哈夫曼树中不存在度为 1 的结点；n 个叶子的哈夫曼树共有 2n 减 1 个结点</text>
</svg>
