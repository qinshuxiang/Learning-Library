<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-label="最小生成树的构造与结果">
  <rect width="720" height="440" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#2c3e50">最小生成树（MST）：从带权无向图到 n 减 1 条边</text>

  <rect x="24" y="46" width="320" height="300" rx="8" fill="#fbfcfd" stroke="#e3e8ee"/>
  <text x="184" y="68" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#5b6b7b">带权无向图（绿实线＝入选，灰虚线＝舍弃）</text>

  <g stroke-width="3.4" stroke-linecap="round" fill="none">
    <line x1="122" y1="122" x2="268" y2="122" stroke="#3aa76d"/>
    <line x1="272" y1="126" x2="124" y2="266" stroke="#3aa76d"/>
    <line x1="122" y1="274" x2="268" y2="274" stroke="#3aa76d"/>
  </g>
  <g stroke-width="2" stroke-dasharray="6 5" fill="none">
    <line x1="120" y1="126" x2="120" y2="266" stroke="#c8d2db"/>
    <line x1="272" y1="126" x2="272" y2="266" stroke="#c8d2db"/>
  </g>

  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" text-anchor="middle" font-weight="600">
    <circle cx="120" cy="120" r="22" fill="#eaf7f1" stroke="#7cc6a5" stroke-width="1.6"/><text x="120" y="125" fill="#24674d">A</text>
    <circle cx="270" cy="120" r="22" fill="#eaf7f1" stroke="#7cc6a5" stroke-width="1.6"/><text x="270" y="125" fill="#24674d">B</text>
    <circle cx="120" cy="272" r="22" fill="#eaf7f1" stroke="#7cc6a5" stroke-width="1.6"/><text x="120" y="277" fill="#24674d">C</text>
    <circle cx="270" cy="272" r="22" fill="#eaf7f1" stroke="#7cc6a5" stroke-width="1.6"/><text x="270" y="277" fill="#24674d">D</text>
  </g>
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" text-anchor="middle">
    <text x="195" y="112" fill="#2c6e54" font-weight="600">2</text>
    <text x="195" y="192" fill="#2c6e54" font-weight="600">1</text>
    <text x="195" y="265" fill="#2c6e54" font-weight="600">3</text>
    <text x="106" y="196" fill="#8a97a4">4</text>
    <text x="286" y="196" fill="#8a97a4">5</text>
  </g>

  <rect x="364" y="46" width="332" height="300" rx="8" fill="#fbfcfd" stroke="#e3e8ee"/>
  <text x="530" y="68" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#5b6b7b">Kruskal：边按权值升序逐条考察</text>

  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5">
    <text x="384" y="98" fill="#2c6e54">① 选 B—C（权 1）</text><text x="640" y="98" text-anchor="end" fill="#3aa76d">✓</text>
    <text x="384" y="128" fill="#2c6e54">② 选 A—B（权 2）</text><text x="640" y="128" text-anchor="end" fill="#3aa76d">✓</text>
    <text x="384" y="158" fill="#2c6e54">③ 选 C—D（权 3）</text><text x="640" y="158" text-anchor="end" fill="#3aa76d">✓</text>
    <text x="384" y="188" fill="#8a97a4">④ 舍 A—C（权 4，成环）</text><text x="640" y="188" text-anchor="end" fill="#c0392b">✗</text>
    <text x="384" y="218" fill="#8a97a4">⑤ 舍 B—D（权 5，成环）</text><text x="640" y="218" text-anchor="end" fill="#c0392b">✗</text>
  </g>

  <line x1="384" y1="238" x2="676" y2="238" stroke="#eef1f4" stroke-width="1"/>
  <text x="384" y="264" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#5b6b7b">选够 4 减 1 等于 3 条边即止</text>
  <text x="384" y="290" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#2c6e54">MST 权值 = 1 + 2 + 3 = 6</text>
  <text x="384" y="316" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8a97a4">判别成环用并查集：两端点已在同一集合则弃</text>

  <text x="360" y="372" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#8a97a4">普里姆算法从任一顶点出发，每次把「距已选集合最近的顶点及其最短边」纳入，适合稠密图</text>
  <text x="360" y="394" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#8a97a4">克鲁斯卡尔算法按边权升序取边、弃成环者，适合稀疏图；当图中边权互不相同时最小生成树唯一</text>
  <text x="360" y="420" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#8a97a4">最小生成树用 n 减 1 条边连通 n 个顶点，总权值最小，且不含任何回路</text>
</svg>
