<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Segoe UI,sans-serif"><defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/></marker></defs><rect x="0" y="0" width="720" height="420" fill="#ffffff"/><rect x="108" y="96" width="176" height="56" rx="9" fill="#eef6f1" stroke="#42b983" stroke-width="1.6" opacity="1"/><text x="196.0" y="128.86" font-size="13.5" text-anchor="middle" fill="#2c3e50" font-weight="600" opacity="1">预测（Forecast）</text><rect x="436" y="96" width="176" height="56" rx="9" fill="#f7fafc" stroke="#c2d1e0" stroke-width="1.4" opacity="1"/><text x="524.0" y="128.86" font-size="13.5" text-anchor="middle" fill="#2c3e50" font-weight="600" opacity="1">估算（Estimate）</text><rect x="272" y="276" width="176" height="56" rx="9" fill="#f7fafc" stroke="#c2d1e0" stroke-width="1.4" opacity="1"/><text x="360.0" y="308.86" font-size="13.5" text-anchor="middle" fill="#2c3e50" font-weight="600" opacity="1">价格（Prices）</text><line x1="284" y1="124" x2="436" y2="124" stroke="#34495e" stroke-width="1.8" stroke-linecap="butt" opacity="1" marker-end="url(#ar-ink)"/><line x1="474" y1="152" x2="400" y2="276" stroke="#34495e" stroke-width="1.8" stroke-linecap="butt" opacity="1" marker-end="url(#ar-ink)"/><line x1="320" y1="276" x2="246" y2="152" stroke="#34495e" stroke-width="1.8" stroke-linecap="butt" opacity="1" marker-end="url(#ar-ink)"/><text x="360" y="108" font-size="11" text-anchor="middle" fill="#7f8c8d" font-weight="normal" opacity="1">市场预测决定产量与成本</text><text x="470" y="214" font-size="11" text-anchor="start" fill="#7f8c8d" font-weight="normal" opacity="1">固定成本</text><text x="470" y="230" font-size="11" text-anchor="start" fill="#7f8c8d" font-weight="normal" opacity="1">决定价格</text><text x="250" y="214" font-size="11" text-anchor="end" fill="#7f8c8d" font-weight="normal" opacity="1">价格反馈</text><text x="250" y="230" font-size="11" text-anchor="end" fill="#7f8c8d" font-weight="normal" opacity="1">修正预测</text><rect x="196" y="356" width="330" height="68.5" rx="7" fill="#f2f5f8" stroke="#dde5ed" stroke-width="1" opacity="1"/><text x="206" y="377.0" font-size="11" text-anchor="start" fill="#2c3e50" font-weight="normal" opacity="1">价格低于假设值：良性循环，预测更高、成本更低</text><text x="206" y="393.5" font-size="11" text-anchor="start" fill="#2c3e50" font-weight="normal" opacity="1">价格高于预测值：恶性循环，须全力打破</text><text x="206" y="410.0" font-size="11" text-anchor="start" fill="#2c3e50" font-weight="normal" opacity="1">循环压力是激励市场与工程人员的最佳动力</text></svg>