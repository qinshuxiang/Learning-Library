<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-label="资源分配图与死锁环路示意">
  <defs>
    <marker id="dg-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3aa76d"/>
    </marker>
    <marker id="dg-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d9534f"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#2c3e50">资源分配图（resource allocation graph）与死锁环路</text>

  <!-- 资源 -->
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" text-anchor="middle">
    <rect x="330" y="80" width="96" height="52" rx="6" fill="#fdf5e6" stroke="#f0d9a8"/>
    <text x="378" y="100" font-size="12.5" font-weight="600" fill="#9a6b16">R1</text>
    <circle cx="368" cy="116" r="5" fill="#d99b23"/>
    <rect x="330" y="290" width="96" height="52" rx="6" fill="#fdf5e6" stroke="#f0d9a8"/>
    <text x="378" y="310" font-size="12.5" font-weight="600" fill="#9a6b16">R2</text>
    <circle cx="368" cy="326" r="5" fill="#d99b23"/>
  </g>

  <!-- 进程 -->
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" text-anchor="middle">
    <circle cx="170" cy="106" r="32" fill="#eaf7f1" stroke="#b7e0cd"/>
    <text x="170" y="111" fill="#2c6e54" font-weight="600">P1</text>
    <circle cx="170" cy="316" r="32" fill="#eaf7f1" stroke="#b7e0cd"/>
    <text x="170" y="321" fill="#2c6e54" font-weight="600">P2</text>
  </g>

  <!-- 分配边（资源 → 进程，实线） -->
  <line x1="326" y1="106" x2="206" y2="106" stroke="#3aa76d" stroke-width="1.8" marker-end="url(#dg-s)"/>
  <text x="266" y="97" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#2c6e54">持有 R1</text>
  <line x1="326" y1="316" x2="206" y2="316" stroke="#3aa76d" stroke-width="1.8" marker-end="url(#dg-s)"/>
  <text x="266" y="307" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#2c6e54">持有 R2</text>

  <!-- 请求边（进程 → 资源，虚线） -->
  <path d="M 186,136 C 250,220 280,292 326,312" fill="none" stroke="#d9534f" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#dg-d)"/>
  <text x="212" y="212" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#c0392b">请求 R2</text>
  <path d="M 186,286 C 246,238 282,166 326,122" fill="none" stroke="#d9534f" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#dg-d)"/>
  <text x="212" y="268" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#c0392b">请求 R1</text>

  <!-- 环路提示 -->
  <text x="264" y="216" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#c0392b">环路</text>
  <text x="264" y="234" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#c0392b">R1→P1→R2→P2→R1</text>

  <!-- 图例 -->
  <rect x="470" y="70" width="228" height="290" rx="8" fill="#fbfcfd" stroke="#e3e8ee"/>
  <text x="486" y="94" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#5b6b7b">图例</text>

  <circle cx="498" cy="124" r="14" fill="#eaf7f1" stroke="#b7e0cd"/>
  <text x="522" y="129" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5b6b7b">圆圈：进程</text>

  <rect x="484" y="156" width="28" height="22" rx="4" fill="#fdf5e6" stroke="#f0d9a8"/>
  <circle cx="498" cy="167" r="4" fill="#d99b23"/>
  <text x="522" y="172" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5b6b7b">方框：资源，点＝实例数</text>

  <line x1="484" y1="204" x2="516" y2="204" stroke="#3aa76d" stroke-width="1.8" marker-end="url(#dg-s)"/>
  <text x="522" y="209" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5b6b7b">分配边：资源 → 进程</text>

  <line x1="484" y1="240" x2="516" y2="240" stroke="#d9534f" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#dg-d)"/>
  <text x="522" y="245" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#5b6b7b">请求边：进程 → 资源</text>

  <text x="486" y="284" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8a97a4">判定要点：</text>
  <text x="486" y="304" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8a97a4">每类资源仅一个实例时，</text>
  <text x="486" y="322" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#c0392b">图上出现环路 ⟺ 死锁</text>
  <text x="486" y="342" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8a97a4">实例多于一个时，有环未必死锁，</text>
  <text x="486" y="358" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8a97a4">须用化简法逐步消边判断</text>

  <text x="360" y="404" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#8a97a4">P1 已占有 R1 又申请 R2，P2 已占有 R2 又申请 R1，谁也不肯释放，四条边首尾相接构成环路</text>
  <text x="360" y="426" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#8a97a4">化简法：反复找出「申请可被满足」的进程并令其运行完成、归还资源，若能把所有边消去则无死锁</text>
</svg>
