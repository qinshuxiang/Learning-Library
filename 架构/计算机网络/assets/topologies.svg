<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="四种网络拓扑：总线型共享主干存在争用，环形用令牌控制发送权，星形靠中央设备点对点转发，网状多路径用于广域网">
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="24" y="30" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#2c3e50">四种网络拓扑</text>
  <text x="24" y="51" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8a97a4">看数据怎么走：总线与环形是广播，星形与网状是点对点</text>
  <rect x="24" y="76" width="204" height="286" rx="10" fill="#f7f9fb" stroke="#e3e9ef"/>
  <rect x="38" y="90" width="4" height="15" rx="2" fill="#a2502f"/>
  <text x="50" y="103" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#a2502f">总线型</text>
  <text x="98" y="103" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9" fill="#8a97a4">Bus</text>
  <text x="40" y="290" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#5b6b7b">广播式，存在总线争用</text>
  <text x="40" y="310" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.4" fill="#8a97a4">集线器组网即此类</text>
  <text x="40" y="336" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.4" fill="#a2502f">逻辑拓扑：总线</text>
  <rect x="240" y="76" width="204" height="286" rx="10" fill="#f7f9fb" stroke="#e3e9ef"/>
  <rect x="254" y="90" width="4" height="15" rx="2" fill="#2c6e54"/>
  <text x="266" y="103" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#2c6e54">环形</text>
  <text x="314" y="103" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9" fill="#8a97a4">Ring</text>
  <text x="256" y="290" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#5b6b7b">广播式，靠令牌控制发送权</text>
  <text x="256" y="310" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.4" fill="#8a97a4">数据单向逐站传递</text>
  <text x="256" y="336" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.4" fill="#2c6e54">逻辑拓扑：环</text>
  <rect x="456" y="76" width="204" height="286" rx="10" fill="#f7f9fb" stroke="#e3e9ef"/>
  <rect x="470" y="90" width="4" height="15" rx="2" fill="#2b5d9e"/>
  <text x="482" y="103" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#2b5d9e">星形</text>
  <text x="530" y="103" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9" fill="#8a97a4">Star</text>
  <text x="472" y="290" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#5b6b7b">点对点，无争用</text>
  <text x="472" y="310" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.4" fill="#8a97a4">中央节点是单点瓶颈</text>
  <text x="472" y="336" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.4" fill="#2b5d9e">逻辑拓扑：星</text>
  <rect x="672" y="76" width="204" height="286" rx="10" fill="#f7f9fb" stroke="#e3e9ef"/>
  <rect x="686" y="90" width="4" height="15" rx="2" fill="#5b4b8a"/>
  <text x="698" y="103" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#5b4b8a">网状</text>
  <text x="746" y="103" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9" fill="#8a97a4">Mesh</text>
  <text x="688" y="290" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#5b6b7b">点对点，多路径可选</text>
  <text x="688" y="310" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.4" fill="#8a97a4">广域网的路由器之间</text>
  <text x="688" y="336" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.4" fill="#5b4b8a">逻辑拓扑：网状</text>
  <line x1="38" y1="176" x2="216" y2="176" stroke="#dfa985" stroke-width="3"/>
  <rect x="54" y="130" width="20" height="16" rx="3" fill="#ffffff" stroke="#e3e9ef"/>
  <text x="64" y="141" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8" fill="#5b6b7b">A</text>
  <line x1="64" y1="146" x2="64" y2="176" stroke="#dfa985" stroke-width="1.2"/>
  <rect x="102" y="130" width="20" height="16" rx="3" fill="#ffffff" stroke="#e3e9ef"/>
  <text x="112" y="141" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8" fill="#5b6b7b">B</text>
  <line x1="112" y1="146" x2="112" y2="176" stroke="#dfa985" stroke-width="1.2"/>
  <rect x="150" y="130" width="20" height="16" rx="3" fill="#ffffff" stroke="#e3e9ef"/>
  <text x="160" y="141" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8" fill="#5b6b7b">C</text>
  <line x1="160" y1="146" x2="160" y2="176" stroke="#dfa985" stroke-width="1.2"/>
  <rect x="192" y="130" width="20" height="16" rx="3" fill="#ffffff" stroke="#e3e9ef"/>
  <text x="202" y="141" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8" fill="#5b6b7b">D</text>
  <line x1="202" y1="146" x2="202" y2="176" stroke="#dfa985" stroke-width="1.2"/>
  <text x="126" y="228" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#8a97a4">共享一条主干</text>
  <text x="126" y="244" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#a2502f">同时发送会冲突</text>
  <line x1="342" y1="112" x2="388" y2="156" stroke="#b7e0cd" stroke-width="2"/>
  <line x1="388" y1="156" x2="342" y2="200" stroke="#b7e0cd" stroke-width="2"/>
  <line x1="342" y1="200" x2="296" y2="156" stroke="#b7e0cd" stroke-width="2"/>
  <line x1="296" y1="156" x2="342" y2="112" stroke="#b7e0cd" stroke-width="2"/>
  <circle cx="342" cy="112" r="11" fill="#ffffff" stroke="#b7e0cd" stroke-width="1.4"/>
  <text x="342" y="116" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8" fill="#2c6e54">A</text>
  <circle cx="388" cy="156" r="11" fill="#ffffff" stroke="#b7e0cd" stroke-width="1.4"/>
  <text x="388" y="160" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8" fill="#2c6e54">B</text>
  <circle cx="342" cy="200" r="11" fill="#ffffff" stroke="#b7e0cd" stroke-width="1.4"/>
  <text x="342" y="204" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8" fill="#2c6e54">C</text>
  <circle cx="296" cy="156" r="11" fill="#ffffff" stroke="#b7e0cd" stroke-width="1.4"/>
  <text x="296" y="160" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8" fill="#2c6e54">D</text>
  <text x="342" y="228" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#8a97a4">令牌顺时针传递</text>
  <text x="342" y="244" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#2c6e54">只有持牌者可发送</text>
  <rect x="540" y="146" width="36" height="22" rx="4" fill="#eef3fb" stroke="#c3d6f0"/>
  <text x="558" y="161" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8" fill="#2b5d9e" font-weight="600">交换机</text>
  <rect x="480" y="112" width="20" height="16" rx="3" fill="#ffffff" stroke="#e3e9ef"/>
  <text x="490" y="123" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8" fill="#5b6b7b">A</text>
  <line x1="490" y1="120" x2="558" y2="157" stroke="#c3d6f0" stroke-width="1.2"/>
  <rect x="616" y="112" width="20" height="16" rx="3" fill="#ffffff" stroke="#e3e9ef"/>
  <text x="626" y="123" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8" fill="#5b6b7b">B</text>
  <line x1="626" y1="120" x2="558" y2="157" stroke="#c3d6f0" stroke-width="1.2"/>
  <rect x="480" y="184" width="20" height="16" rx="3" fill="#ffffff" stroke="#e3e9ef"/>
  <text x="490" y="195" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8" fill="#5b6b7b">C</text>
  <line x1="490" y1="192" x2="558" y2="157" stroke="#c3d6f0" stroke-width="1.2"/>
  <rect x="616" y="184" width="20" height="16" rx="3" fill="#ffffff" stroke="#e3e9ef"/>
  <text x="626" y="195" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8" fill="#5b6b7b">D</text>
  <line x1="626" y1="192" x2="558" y2="157" stroke="#c3d6f0" stroke-width="1.2"/>
  <text x="558" y="228" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#8a97a4">每端口一条独立线路</text>
  <text x="558" y="244" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#2b5d9e">中央设备按地址转发</text>
  <line x1="710" y1="120" x2="848" y2="120" stroke="#d6cff0" stroke-width="1.2"/>
  <line x1="710" y1="120" x2="710" y2="194" stroke="#d6cff0" stroke-width="1.2"/>
  <line x1="710" y1="120" x2="848" y2="194" stroke="#d6cff0" stroke-width="1.2"/>
  <line x1="848" y1="120" x2="710" y2="194" stroke="#d6cff0" stroke-width="1.2"/>
  <line x1="848" y1="120" x2="848" y2="194" stroke="#d6cff0" stroke-width="1.2"/>
  <line x1="710" y1="194" x2="848" y2="194" stroke="#d6cff0" stroke-width="1.2"/>
  <rect x="700" y="112" width="20" height="16" rx="3" fill="#ffffff" stroke="#d6cff0"/>
  <text x="710" y="123" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8" fill="#5b4b8a">A</text>
  <rect x="838" y="112" width="20" height="16" rx="3" fill="#ffffff" stroke="#d6cff0"/>
  <text x="848" y="123" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8" fill="#5b4b8a">B</text>
  <rect x="700" y="186" width="20" height="16" rx="3" fill="#ffffff" stroke="#d6cff0"/>
  <text x="710" y="197" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8" fill="#5b4b8a">C</text>
  <rect x="838" y="186" width="20" height="16" rx="3" fill="#ffffff" stroke="#d6cff0"/>
  <text x="848" y="197" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8" fill="#5b4b8a">D</text>
  <text x="774" y="228" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#8a97a4">断了可绕行</text>
  <text x="774" y="244" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#5b4b8a">线路多、控制复杂</text>
  <text x="24" y="392" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.4" fill="#5b6b7b">物理拓扑与逻辑拓扑可能不同：集线器把线集中到一个盒子，物理上是星形；内部却是一条共享总线，逻辑上仍是总线型，照样有争用。</text>
  <text x="24" y="414" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.8" fill="#8a97a4">总线、环形、星形多见于局域网，网状多见于广域网；考试问拓扑，默认指逻辑拓扑。</text>
</svg>
