  <text x="277" y="312" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#8a97a4">比特流 110100……0101</text>
  <text x="601" y="312" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#8a97a4">比特流 110100……0101</text>
  <line x1="168" y1="320" x2="380" y2="320" stroke="#dfe4ea" stroke-width="1.5"/>
  <line x1="484" y1="320" x2="716" y2="320" stroke="#dfe4ea" stroke-width="1.5"/>
  <text x="116" y="360" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="600" fill="#5b6b7b">主机 A</text>
  <text x="432" y="360" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="600" fill="#5b6b7b">路由器</text>
  <text x="768" y="360" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="600" fill="#5b6b7b">主机 B</text>
  <rect x="24" y="386" width="414" height="84" rx="8" fill="#f7f9fb" stroke="#e3e9ef"/>
  <text x="44" y="410" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2c3e50">物理链路 = 传输介质（0 层）＋ 物理层（1 层）</text>
  <text x="44" y="432" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#8a97a4">只有比特通路，没有协议，只能保证比特送到，不能保证内容正确。</text>
  <text x="44" y="452" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#8a97a4">它让相邻结点之间在物理上「连得上」。</text>
  <rect x="462" y="386" width="414" height="84" rx="8" fill="#f7f9fb" stroke="#e3e9ef"/>
  <text x="482" y="410" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" font-weight="600" fill="#2c3e50">逻辑链路 = 物理链路 ＋ 数据链路层协议</text>
  <text x="482" y="432" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#8a97a4">在物理链路之上加帧定界、差错控制与流量控制。</text>
  <text x="482" y="452" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#8a97a4">它让相邻结点之间「传得对」，即逻辑上无差错的数据链路。</text>
  <text x="24" y="500" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#5b6b7b">职责边界：数据链路层使用物理层的比特传输服务，为网络层提供帧传输服务；路由器只解封装到网络层，转发时逐跳重新封装，端到端的可靠性不归本层负责。</text>
  <text x="24" y="522" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#8a97a4">图中 5—1 为五层模型的层次编号：应用层 5、传输层 4、网络层 3、数据链路层 2、物理层 1。</text>
</svg>
