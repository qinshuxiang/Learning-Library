  <text x="730" y="278" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#a2502f" opacity="0.7">2</text>
  <text x="778" y="278" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#a2502f" font-weight="600">数据链路层</text>
