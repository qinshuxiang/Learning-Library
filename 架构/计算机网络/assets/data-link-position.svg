  <rect x="182" y="262" width="190" height="30" rx="3" fill="#f1f4f7" stroke="#cfd8e2"/>
  <rect x="224" y="262" width="114" height="30" fill="#eaf7f1" stroke="#b7e0cd"/>
  <rect x="338" y="262" width="34" height="30" rx="3" fill="#f1f4f7" stroke="#cfd8e2"/>
  <text x="203.0" y="282" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#5b6b7b">首部</text>
  <text x="281.0" y="282" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#2c6e54">数据（IP 数据报）</text>
  <text x="355.0" y="282" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#5b6b7b">尾部</text>
