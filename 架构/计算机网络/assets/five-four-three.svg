<text x="290" y="264" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#8a97a4" font-weight="400" text-anchor="middle">不挂设备</text>
<text x="610" y="250" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#8a97a4" font-weight="400" text-anchor="middle">只作延长</text>
<text x="610" y="264" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#8a97a4" font-weight="400" text-anchor="middle">不挂设备</text>
<text x="24" y="306" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#5b6b7b" font-weight="400" text-anchor="start">为什么不能无限串联：多一台中继器，就多一段传播时延和一次转发时延；</text>
<text x="24" y="324" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#5b6b7b" font-weight="400" text-anchor="start">最长路径的往返时延一旦超过以太网的争用窗口（512 比特时间），冲突检测就会失效。</text>
<text x="24" y="346" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#8a97a4" font-weight="400" text-anchor="start">早期总线型以太网用一根同轴电缆分接多台机器，这根电缆就是一个「网段」。</text>
</svg>