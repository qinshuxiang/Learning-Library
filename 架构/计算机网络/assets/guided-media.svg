<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" role="img" aria-label="双绞线、同轴电缆与光纤三种导向型传输介质的结构对照">
<rect width="900" height="730" fill="#ffffff"/>
<text x="24" y="32" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="16" fill="#2c3e50" font-weight="600" text-anchor="start">三种导向型传输介质的结构</text>
<text x="24" y="52" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8a97a4" font-weight="400" text-anchor="start">从上到下：抗干扰依次增强，传输损耗依次减小，造价依次升高</text>
<line x1="24" y1="272" x2="876" y2="272" stroke="#e3e9ef" stroke-width="1"/>
<line x1="24" y1="478" x2="876" y2="478" stroke="#e3e9ef" stroke-width="1"/>
