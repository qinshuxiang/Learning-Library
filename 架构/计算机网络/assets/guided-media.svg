<text x="24" y="308" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#2c3e50" font-weight="600" text-anchor="start">同轴电缆</text>
<text x="24" y="332" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#5b6b7b" font-weight="400" text-anchor="start">内导体传信号，屏蔽层抗干扰</text>
<text x="24" y="350" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#5b6b7b" font-weight="400" text-anchor="start">由内到外：铜芯 → 绝缘层 → 屏蔽层 → 保护套</text>
<text x="24" y="368" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#5b6b7b" font-weight="400" text-anchor="start">铜芯越粗，电阻越小、衰减越小、传得越远</text>
<text x="24" y="386" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#5b6b7b" font-weight="400" text-anchor="start">早期以太网与 2012 年前的有线电视用它</text>
