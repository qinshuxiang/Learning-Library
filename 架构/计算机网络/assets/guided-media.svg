<text x="24" y="514" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#2c3e50" font-weight="600" text-anchor="start">光纤</text>
<text x="24" y="538" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#5b6b7b" font-weight="400" text-anchor="start">纤芯折射率高，包层折射率低</text>
<text x="24" y="556" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#5b6b7b" font-weight="400" text-anchor="start">入射角足够大 → 全反射，光被困在纤芯里</text>
<text x="24" y="574" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#5b6b7b" font-weight="400" text-anchor="start">抗干扰最强、损耗最小、线径最细</text>
