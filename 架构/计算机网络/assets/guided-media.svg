<text x="24" y="706" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#8a97a4" font-weight="400" text-anchor="start">三者的共同目标都是对抗信道噪声：抗干扰越强，噪声功率越低，按香农定理可用的极限速率越高。</text>
