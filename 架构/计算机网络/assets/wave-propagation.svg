<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="长波与短波的指向性、绕射性与中继需求对比">
<rect width="900" height="460" fill="#ffffff"/>
<text x="24" y="32" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="16" fill="#2c3e50" font-weight="600" text-anchor="start">长波与短波：波长决定指向性</text>
<text x="24" y="52" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8a97a4" font-weight="400" text-anchor="start">c = λ·f 为常量，波长越短频率越高、带宽越大、指向性越强</text>
<line x1="24" y1="72" x2="876" y2="72" stroke="#eef2f6" stroke-width="1"/>
<text x="28" y="100" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2f7d68" font-weight="600" text-anchor="start">长波：绕射为主，指向性弱</text>
<line x1="28" y1="386" x2="426" y2="386" stroke="#c3ccd6" stroke-width="2"/>
<path d="M120,386 L106,340 L134,340 Z" fill="#dfeae6" stroke="#7ba79b" stroke-width="1.2"/>
<path d="M90.0,340 A30,30 0 0 1 150.0,340" fill="none" stroke="#2f7d68" stroke-width="1.1" stroke-dasharray="4 4" opacity="0.5"/>
<path d="M65.0,340 A55,55 0 0 1 175.0,340" fill="none" stroke="#2f7d68" stroke-width="1.1" stroke-dasharray="4 4" opacity="0.5"/>
<path d="M40.0,340 A80,80 0 0 1 200.0,340" fill="none" stroke="#2f7d68" stroke-width="1.1" stroke-dasharray="4 4" opacity="0.5"/>
<rect x="242" y="318" width="22" height="68" fill="#dbe3ea" stroke="#b9c3cd" stroke-width="1.2"/>
<text x="253" y="312" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.5" fill="#8a97a4" font-weight="400" text-anchor="middle">障碍</text>
<path d="M136,338 Q 272,240 392,336" fill="none" stroke="#2f7d68" stroke-width="1.5" opacity="0.9"/>
<path d="M136,338 Q 272,252 392,336" fill="none" stroke="#2f7d68" stroke-width="1.5" opacity="0.6"/>
<path d="M136,338 Q 272,264 392,336" fill="none" stroke="#2f7d68" stroke-width="1.5" opacity="0.35"/>
<path d="M392,386 L380,348 L404,348 Z" fill="#dfeae6" stroke="#7ba79b" stroke-width="1.2"/>
<text x="28" y="410" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#5b6b7b" font-weight="400" text-anchor="start">绕射强，可越过障碍、贴地传播；收发天线不必对准</text>
<text x="28" y="428" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#5b6b7b" font-weight="400" text-anchor="start">代价：可用带宽小，速率低</text>
<line x1="448" y1="80" x2="448" y2="432" stroke="#eef2f6" stroke-width="1"/>
<text x="470" y="100" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#a8762c" font-weight="600" text-anchor="start">短波（微波）：视距直线，必须对准</text>
<line x1="470" y1="386" x2="868" y2="386" stroke="#c3ccd6" stroke-width="2"/>
<path d="M470,306 Q 446,346 470,386" fill="none" stroke="#a8762c" stroke-width="5" stroke-linecap="round"/>
<line x1="470" y1="346" x2="504" y2="346" stroke="#a8762c" stroke-width="1.6"/>
<circle cx="504" cy="346" r="4" fill="#fdf5e6" stroke="#a8762c" stroke-width="1.4"/>
<rect x="762" y="146" width="26" height="20" rx="3" fill="#eef3fb" stroke="#7fa3c9" stroke-width="1.2"/>
<rect x="730" y="150" width="28" height="12" fill="#cfe3f5" stroke="#7fa3c9" stroke-width="1"/>
<rect x="792" y="150" width="28" height="12" fill="#cfe3f5" stroke="#7fa3c9" stroke-width="1"/>
<line x1="510" y1="341" x2="758" y2="157" stroke="#a8762c" stroke-width="1.3" stroke-dasharray="6 4" opacity="0.75"/>
<line x1="510" y1="351" x2="758" y2="167" stroke="#a8762c" stroke-width="1.3" stroke-dasharray="6 4" opacity="0.75"/>
<text x="516" y="214" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9" fill="#8a97a4" font-weight="400" text-anchor="start">视距直线传播，被遮挡即中断</text>
<text x="470" y="410" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#5b6b7b" font-weight="400" text-anchor="start">指向性强，收发天线必须严格对准；带宽大、速率高</text>
<text x="470" y="428" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#5b6b7b" font-weight="400" text-anchor="start">远距离靠中继：同步卫星 36000 km、时延 >500 ms；低轨星座可压到 20 ms</text>
</svg>