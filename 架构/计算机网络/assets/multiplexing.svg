<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="频分复用、时分复用与统计时分复用的频率-时间占用对比">
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="24" y="30" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#2c3e50">三种复用方式的资源占用对比</text>
  <text x="24" y="50" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8a97a4">横轴为时间，纵轴为频率；同一颜色的格子表示同一个用户</text>
  <text x="24" y="78" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#2c3e50">频分复用（FDM）</text>
  <text x="24" y="96" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#8a97a4">每个用户独占一段频带，时间上连续</text>
