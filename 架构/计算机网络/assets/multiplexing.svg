  <text x="24" y="362" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#2c3e50">统计时分复用（STDM）</text>
  <text x="24" y="380" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#8a97a4">有数据才占时隙，空时隙可被其他用户使用</text>
