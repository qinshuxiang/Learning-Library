  <line x1="840.0" y1="112" x2="840.0" y2="190" stroke="#f0f3f6" stroke-width="1"/>
  <rect x="180" y="116" width="660" height="16" fill="#eaf7f1" stroke="#b7e0cd"/>
  <text x="188" y="128" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9" fill="#5b6b7b">用户1</text>
  <rect x="180" y="134" width="660" height="16" fill="#eef3fb" stroke="#c3d6f0"/>
  <text x="188" y="146" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9" fill="#5b6b7b">用户2</text>
  <rect x="180" y="152" width="660" height="16" fill="#fdf5e6" stroke="#f0d9a8"/>
  <text x="188" y="164" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9" fill="#5b6b7b">用户3</text>
  <rect x="180" y="170" width="660" height="16" fill="#f5effb" stroke="#dcc9f0"/>
  <text x="188" y="182" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9" fill="#5b6b7b">用户4</text>
  <text x="24" y="190" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9" fill="#8a97a4">频率 ↑</text>
  <text x="24" y="220" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#2c3e50">时分复用（TDM）</text>
  <text x="24" y="238" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#8a97a4">每个用户在每帧中占固定序号的时隙，时隙空着也不让给别人</text>
