<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="多模光纤与单模光纤的结构、光路与输出脉冲对比">
<rect width="900" height="470" fill="#ffffff"/>
<text x="24" y="32" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="16" fill="#2c3e50" font-weight="600" text-anchor="start">单模光纤与多模光纤</text>
<text x="24" y="52" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8a97a4" font-weight="400" text-anchor="start">同一长度下，多模因多条光路时延不同而使脉冲展宽；单模只有一条光路，波形基本不变</text>
<text x="24" y="96" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2c3e50" font-weight="600" text-anchor="start">多模光纤（纤芯 50 / 62.5 μm）</text>
<text x="24" y="114" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#5b6b7b" font-weight="400" text-anchor="start">纤芯粗，多条光线以不同入射角同时传播，路程不同 → 到达时刻不同 → 模式色散</text>
<rect x="270" y="130" width="380" height="96" fill="#f7f9fb"/>
<line x1="270" y1="130" x2="650" y2="130" stroke="#c3ccd6" stroke-width="2"/>
<line x1="270" y1="226" x2="650" y2="226" stroke="#c3ccd6" stroke-width="2"/>
<polyline points="270 178 340 132 410 224 480 132 550 224 620 150 650 190" fill="none" stroke="#a8762c" stroke-width="1.5" opacity="0.85"/>
<polyline points="270 178 320 224 390 132 470 224 540 132 610 210 650 170" fill="none" stroke="#a8762c" stroke-width="1.5" opacity="0.85"/>
<polyline points="270 178 650 178" fill="none" stroke="#a8762c" stroke-width="1.5" opacity="0.85"/>
<path d="M218,206 L218,152 L248,152 L248,206 Z" fill="#cfe3f5" stroke="#3f6ea8" stroke-width="1.4"/>
<text x="233" y="232" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9" fill="#8a97a4" font-weight="400" text-anchor="middle">输入脉冲</text>
<path d="M668,210 L698,156 L778,156 L808,210 Z" fill="#f0d9a8" stroke="#a8762c" stroke-width="1.4"/>
<text x="738" y="232" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9" fill="#8a97a4" font-weight="400" text-anchor="middle">输出脉冲：展宽、幅度降低</text>
<text x="24" y="296" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2c3e50" font-weight="600" text-anchor="start">单模光纤（纤芯约 9 μm）</text>
<text x="24" y="314" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#5b6b7b" font-weight="400" text-anchor="start">纤芯细到直径小于光波波长，只有一条传播模式，光近乎沿轴直行，损耗低、失真小</text>
<rect x="270" y="330" width="380" height="96" fill="#f7f9fb"/>
<line x1="270" y1="330" x2="650" y2="330" stroke="#c3ccd6" stroke-width="2"/>
<line x1="270" y1="426" x2="650" y2="426" stroke="#c3ccd6" stroke-width="2"/>
<line x1="270" y1="378" x2="650" y2="378" stroke="#3f6ea8" stroke-width="2"/>
<path d="M218,406 L218,352 L248,352 L248,406 Z" fill="#cfe3f5" stroke="#3f6ea8" stroke-width="1.4"/>
<text x="233" y="432" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9" fill="#8a97a4" font-weight="400" text-anchor="middle">输入脉冲</text>
<path d="M676,410 L686,356 L718,356 L728,410 Z" fill="#cfe3f5" stroke="#3f6ea8" stroke-width="1.4"/>
<text x="702" y="432" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9" fill="#8a97a4" font-weight="400" text-anchor="middle">输出脉冲：几乎不变形</text>
</svg>