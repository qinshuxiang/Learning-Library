<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="集线器不隔离冲突域、级联会合并、交换机可隔离">
<rect width="900" height="430" fill="#ffffff"/>
<text x="24" y="30" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="16" fill="#2c3e50" font-weight="600" text-anchor="start">冲突域：集线器不隔离，交换机能隔离</text>
<text x="24" y="52" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8a97a4" font-weight="400" text-anchor="start">两台主机同时发送就会冲突，它们就处在同一个冲突域（碰撞域）</text>
<rect x="20" y="72" width="268" height="262" rx="10" fill="#fbfcfd" stroke="#e3e9ef" stroke-width="1"/>
<rect x="306" y="72" width="268" height="262" rx="10" fill="#fbfcfd" stroke="#e3e9ef" stroke-width="1"/>
<rect x="592" y="72" width="288" height="262" rx="10" fill="#fbfcfd" stroke="#e3e9ef" stroke-width="1"/>
<text x="34" y="92" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#2c3e50" font-weight="600" text-anchor="start">① 一台集线器</text>
<rect x="66" y="112" width="176" height="178" rx="12" fill="#a8485c" fill-opacity="0.045" stroke="#a8485c" stroke-width="1.2" stroke-dasharray="5 3"/>
<line x1="154" y1="202" x2="92" y2="136" stroke="#5b6b7b" stroke-width="1.2"/>
<line x1="154" y1="202" x2="216" y2="136" stroke="#5b6b7b" stroke-width="1.2"/>
<line x1="154" y1="202" x2="92" y2="268" stroke="#5b6b7b" stroke-width="1.2"/>
<line x1="154" y1="202" x2="216" y2="268" stroke="#5b6b7b" stroke-width="1.2"/>
<rect x="135" y="189" width="38" height="26" rx="3" fill="#eef3f8" stroke="#3f6ea8" stroke-width="1.3"/>
<text x="154" y="205.5" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8" fill="#3f6ea8" font-weight="600" text-anchor="middle">HUB</text>
<rect x="82" y="129" width="20" height="13" rx="2" fill="#ffffff" stroke="#5b6b7b" stroke-width="1.1"/>
<line x1="88" y1="144" x2="96" y2="144" stroke="#5b6b7b" stroke-width="1.1"/>
<rect x="206" y="129" width="20" height="13" rx="2" fill="#ffffff" stroke="#5b6b7b" stroke-width="1.1"/>
<line x1="212" y1="144" x2="220" y2="144" stroke="#5b6b7b" stroke-width="1.1"/>
<rect x="82" y="261" width="20" height="13" rx="2" fill="#ffffff" stroke="#5b6b7b" stroke-width="1.1"/>
<line x1="88" y1="276" x2="96" y2="276" stroke="#5b6b7b" stroke-width="1.1"/>
<rect x="206" y="261" width="20" height="13" rx="2" fill="#ffffff" stroke="#5b6b7b" stroke-width="1.1"/>
<line x1="212" y1="276" x2="220" y2="276" stroke="#5b6b7b" stroke-width="1.1"/>
<text x="154" y="310" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#a8485c" font-weight="600" text-anchor="middle">1 个冲突域</text>
<text x="154" y="352" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#5b6b7b" font-weight="400" text-anchor="middle">所有端口同属一个冲突域</text>
<text x="154" y="368" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#5b6b7b" font-weight="400" text-anchor="middle">任何两个端口同时发送就冲突</text>
<text x="320" y="92" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#2c3e50" font-weight="600" text-anchor="start">② 两级集线器级联</text>
<rect x="328" y="112" width="238" height="178" rx="12" fill="#a8485c" fill-opacity="0.045" stroke="#a8485c" stroke-width="1.2" stroke-dasharray="5 3"/>
<line x1="386" y1="202" x2="348" y2="136" stroke="#5b6b7b" stroke-width="1.2"/>
<line x1="386" y1="202" x2="348" y2="268" stroke="#5b6b7b" stroke-width="1.2"/>
<line x1="508" y1="202" x2="546" y2="136" stroke="#5b6b7b" stroke-width="1.2"/>
<line x1="508" y1="202" x2="546" y2="268" stroke="#5b6b7b" stroke-width="1.2"/>
<line x1="405" y1="202" x2="489" y2="202" stroke="#5b6b7b" stroke-width="1.2"/>
<rect x="367" y="189" width="38" height="26" rx="3" fill="#eef3f8" stroke="#3f6ea8" stroke-width="1.3"/>
<text x="386" y="205.5" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8" fill="#3f6ea8" font-weight="600" text-anchor="middle">HUB</text>
<rect x="489" y="189" width="38" height="26" rx="3" fill="#eef3f8" stroke="#3f6ea8" stroke-width="1.3"/>
<text x="508" y="205.5" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8" fill="#3f6ea8" font-weight="600" text-anchor="middle">HUB</text>
<rect x="338" y="129" width="20" height="13" rx="2" fill="#ffffff" stroke="#5b6b7b" stroke-width="1.1"/>
<line x1="344" y1="144" x2="352" y2="144" stroke="#5b6b7b" stroke-width="1.1"/>
<rect x="338" y="261" width="20" height="13" rx="2" fill="#ffffff" stroke="#5b6b7b" stroke-width="1.1"/>
<line x1="344" y1="276" x2="352" y2="276" stroke="#5b6b7b" stroke-width="1.1"/>
<rect x="536" y="129" width="20" height="13" rx="2" fill="#ffffff" stroke="#5b6b7b" stroke-width="1.1"/>
<line x1="542" y1="144" x2="550" y2="144" stroke="#5b6b7b" stroke-width="1.1"/>
<rect x="536" y="261" width="20" height="13" rx="2" fill="#ffffff" stroke="#5b6b7b" stroke-width="1.1"/>
<line x1="542" y1="276" x2="550" y2="276" stroke="#5b6b7b" stroke-width="1.1"/>
<text x="447" y="310" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#a8485c" font-weight="600" text-anchor="middle">合并为 1 个冲突域</text>
<text x="447" y="352" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#5b6b7b" font-weight="400" text-anchor="middle">任一主机发送，信号经主干集线器</text>
<text x="447" y="368" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#5b6b7b" font-weight="400" text-anchor="middle">转发到每一条线路，全网一起冲突</text>
<text x="606" y="92" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#2c3e50" font-weight="600" text-anchor="start">③ 中间加一台交换机</text>
<rect x="608" y="112" width="81" height="178" rx="12" fill="#a8485c" fill-opacity="0.045" stroke="#a8485c" stroke-width="1.2" stroke-dasharray="5 3"/>
<rect x="788" y="112" width="80" height="178" rx="12" fill="#a8485c" fill-opacity="0.045" stroke="#a8485c" stroke-width="1.2" stroke-dasharray="5 3"/>
<line x1="660" y1="202" x2="626" y2="136" stroke="#5b6b7b" stroke-width="1.2"/>
<line x1="660" y1="202" x2="626" y2="268" stroke="#5b6b7b" stroke-width="1.2"/>
<line x1="818" y1="202" x2="848" y2="136" stroke="#5b6b7b" stroke-width="1.2"/>
<line x1="818" y1="202" x2="848" y2="268" stroke="#5b6b7b" stroke-width="1.2"/>
<line x1="679" y1="202" x2="711" y2="202" stroke="#5b6b7b" stroke-width="1.2"/>
<line x1="767" y1="202" x2="799" y2="202" stroke="#5b6b7b" stroke-width="1.2"/>
<rect x="641" y="189" width="38" height="26" rx="3" fill="#eef3f8" stroke="#3f6ea8" stroke-width="1.3"/>
<text x="660" y="205.5" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8" fill="#3f6ea8" font-weight="600" text-anchor="middle">HUB</text>
<rect x="711" y="188" width="56" height="28" rx="3" fill="#f6eef1" stroke="#a8485c" stroke-width="1.3"/>
<text x="739" y="205" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="7.5" fill="#a8485c" font-weight="600" text-anchor="middle">交换机</text>
<rect x="799" y="189" width="38" height="26" rx="3" fill="#eef3f8" stroke="#3f6ea8" stroke-width="1.3"/>
<text x="818" y="205.5" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8" fill="#3f6ea8" font-weight="600" text-anchor="middle">HUB</text>
<rect x="616" y="129" width="20" height="13" rx="2" fill="#ffffff" stroke="#5b6b7b" stroke-width="1.1"/>
<line x1="622" y1="144" x2="630" y2="144" stroke="#5b6b7b" stroke-width="1.1"/>
<rect x="616" y="261" width="20" height="13" rx="2" fill="#ffffff" stroke="#5b6b7b" stroke-width="1.1"/>
<line x1="622" y1="276" x2="630" y2="276" stroke="#5b6b7b" stroke-width="1.1"/>
<rect x="838" y="129" width="20" height="13" rx="2" fill="#ffffff" stroke="#5b6b7b" stroke-width="1.1"/>
<line x1="844" y1="144" x2="852" y2="144" stroke="#5b6b7b" stroke-width="1.1"/>
<rect x="838" y="261" width="20" height="13" rx="2" fill="#ffffff" stroke="#5b6b7b" stroke-width="1.1"/>
<line x1="844" y1="276" x2="852" y2="276" stroke="#5b6b7b" stroke-width="1.1"/>
<text x="739" y="310" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#a8485c" font-weight="600" text-anchor="middle">2 个冲突域</text>
<text x="736" y="352" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#5b6b7b" font-weight="400" text-anchor="middle">交换机按 MAC 表定向转发，</text>
<text x="736" y="368" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#5b6b7b" font-weight="400" text-anchor="middle">两侧的信号互不扩散</text>
<text x="24" y="400" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#5b6b7b" font-weight="400" text-anchor="start">集线器＝多端口中继器：一个端口收到的信号复制到其余所有端口，所以不能隔离冲突域。</text>
<text x="24" y="418" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#8a97a4" font-weight="400" text-anchor="start">数冲突域：每个交换机端口各算一个；集线器连同其下所有端口算一个。</text>
</svg>