<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 566" width="900" height="566" role="img" aria-label="报文切分为定长分组的结构，以及分组走不同路径导致失序、接收端按分组号重排的过程">
  <rect width="900" height="566" fill="#ffffff"/>
  <text x="24" y="30" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#2c3e50">报文、分组与失序重组</text>
  <text x="24" y="51" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8a97a4">把不定长的报文切成定长分组，代价是可能失序；解法是给每个分组编上号</text>
  <text x="32" y="86" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#8a97a4">报文（总长 4 KB，不定长）</text>
  <rect x="32" y="94" width="200" height="56" rx="4" fill="#eef3fb" stroke="#c3d6f0"/>
  <line x1="82" y1="94" x2="82" y2="150" stroke="#c3d6f0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="132" y1="94" x2="132" y2="150" stroke="#c3d6f0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="182" y1="94" x2="182" y2="150" stroke="#c3d6f0" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="132" y="128" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#2b5d9e" font-weight="600">一整块数据</text>
  <text x="132" y="166" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9" fill="#8a97a4">虚线为切分位置</text>
  <line x1="242" y1="122" x2="296" y2="122" stroke="#cfd8e0" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="269" y="112" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#8a97a4">切分</text>
  <rect x="316" y="94" width="44" height="56" rx="4" fill="#fdf3ee" stroke="#f2c7b3"/>
  <text x="338" y="112" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.2" fill="#a2502f">源</text>
  <text x="338" y="127" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.2" fill="#a2502f">目的</text>
  <text x="338" y="142" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.2" fill="#a2502f">序 0</text>
  <rect x="360" y="94" width="80" height="56" rx="4" fill="#f7f9fb" stroke="#e3e9ef"/>
  <text x="400" y="127" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#5b6b7b">1 KB</text>
  <text x="378" y="166" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#2c3e50">分组 0</text>
  <rect x="452" y="94" width="44" height="56" rx="4" fill="#fdf3ee" stroke="#f2c7b3"/>
  <text x="474" y="112" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.2" fill="#a2502f">源</text>
  <text x="474" y="127" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.2" fill="#a2502f">目的</text>
  <text x="474" y="142" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.2" fill="#a2502f">序 1</text>
  <rect x="496" y="94" width="80" height="56" rx="4" fill="#f7f9fb" stroke="#e3e9ef"/>
  <text x="536" y="127" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#5b6b7b">1 KB</text>
  <text x="514" y="166" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#2c3e50">分组 1</text>
  <rect x="588" y="94" width="44" height="56" rx="4" fill="#fdf3ee" stroke="#f2c7b3"/>
  <text x="610" y="112" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.2" fill="#a2502f">源</text>
  <text x="610" y="127" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.2" fill="#a2502f">目的</text>
  <text x="610" y="142" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.2" fill="#a2502f">序 2</text>
  <rect x="632" y="94" width="80" height="56" rx="4" fill="#f7f9fb" stroke="#e3e9ef"/>
  <text x="672" y="127" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#5b6b7b">1 KB</text>
  <text x="650" y="166" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#2c3e50">分组 2</text>
  <rect x="724" y="94" width="44" height="56" rx="4" fill="#fdf3ee" stroke="#f2c7b3"/>
  <text x="746" y="112" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.2" fill="#a2502f">源</text>
  <text x="746" y="127" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.2" fill="#a2502f">目的</text>
  <text x="746" y="142" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.2" fill="#a2502f">序 3</text>
  <rect x="768" y="94" width="80" height="56" rx="4" fill="#f7f9fb" stroke="#e3e9ef"/>
  <text x="808" y="127" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#5b6b7b">1 KB</text>
  <text x="786" y="166" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#2c3e50">分组 3</text>
  <text x="32" y="200" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#5b6b7b">每个分组自带首部：源地址、目的地址、分组号。首部就是控制信息，数据段是被切开的那一小块。</text>
  <line x1="24" y1="222" x2="876" y2="222" stroke="#e3e9ef" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="24" y="250" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" font-weight="600" fill="#2c3e50">分组各走各的路，到达顺序可能打乱</text>
  <rect x="56" y="316" width="64" height="42" rx="5" fill="#f7f9fb" stroke="#e3e9ef"/>
  <text x="88" y="334" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#2c3e50" font-weight="600">H1</text>
  <text x="88" y="348" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.4" fill="#8a97a4">发送端</text>
  <rect x="240" y="322" width="56" height="28" rx="4" fill="#f7f9fb" stroke="#e3e9ef"/>
  <text x="268" y="340" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#5b6b7b" font-weight="600">R1</text>
  <rect x="430" y="272" width="56" height="28" rx="4" fill="#f7f9fb" stroke="#e3e9ef"/>
  <text x="458" y="290" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#5b6b7b" font-weight="600">R2</text>
  <rect x="430" y="380" width="56" height="28" rx="4" fill="#f7f9fb" stroke="#e3e9ef"/>
  <text x="458" y="398" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#5b6b7b" font-weight="600">R3</text>
  <rect x="700" y="316" width="72" height="42" rx="5" fill="#f7f9fb" stroke="#e3e9ef"/>
  <text x="736" y="334" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#2c3e50" font-weight="600">H5</text>
  <text x="736" y="348" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.4" fill="#8a97a4">接收端</text>
  <line x1="120" y1="337" x2="240" y2="337" stroke="#cfd8e0" stroke-width="1.4"/>
  <line x1="296" y1="330" x2="430" y2="290" stroke="#f2c7b3" stroke-width="1.6"/>
  <line x1="296" y1="344" x2="430" y2="390" stroke="#b7e0cd" stroke-width="1.6"/>
  <line x1="486" y1="290" x2="700" y2="332" stroke="#f2c7b3" stroke-width="1.6"/>
  <line x1="486" y1="390" x2="700" y2="352" stroke="#b7e0cd" stroke-width="1.6"/>
  <text x="350" y="300" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.4" fill="#a2502f" font-weight="600">分组 0、1 走上路</text>
  <text x="350" y="384" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.4" fill="#2c6e54" font-weight="600">分组 2 走下路（上面拥塞）</text>
  <text x="600" y="456" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#8a97a4">到达顺序</text>
  <rect x="650" y="438" width="24" height="24" rx="4" fill="#fdf3ee" stroke="#f2c7b3"/>
  <text x="662" y="454" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#a2502f" font-weight="600">2</text>
  <rect x="682" y="438" width="24" height="24" rx="4" fill="#fdf3ee" stroke="#f2c7b3"/>
  <text x="694" y="454" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#a2502f" font-weight="600">0</text>
  <rect x="714" y="438" width="24" height="24" rx="4" fill="#fdf3ee" stroke="#f2c7b3"/>
  <text x="726" y="454" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#a2502f" font-weight="600">1</text>
  <line x1="746" y1="450" x2="770" y2="450" stroke="#cfd8e0" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="758" y="434" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9" fill="#8a97a4">按号重排</text>
  <rect x="780" y="438" width="24" height="24" rx="4" fill="#f7f9fb" stroke="#e3e9ef"/>
  <text x="792" y="454" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#5b6b7b">0</text>
  <rect x="812" y="438" width="24" height="24" rx="4" fill="#f7f9fb" stroke="#e3e9ef"/>
  <text x="824" y="454" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#5b6b7b">1</text>
  <rect x="844" y="438" width="24" height="24" rx="4" fill="#f7f9fb" stroke="#e3e9ef"/>
  <text x="856" y="454" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#5b6b7b">2</text>
  <text x="24" y="500" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#5b6b7b">重排的依据只有分组号：数据段本身不带位置信息，谁先到不代表谁在前。去掉首部、按序拼接，才还原成原来的报文。</text>
  <text x="24" y="524" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#8a97a4">IP 分组不保证按序到达；排序、去重、丢包重传由传输层（TCP）负责，网络层只管尽力转发。</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cfd8e0"/></marker>
  </defs>
</svg>
