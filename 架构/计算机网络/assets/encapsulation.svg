<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" role="img" aria-label="数据封装过程：发送方从应用层到物理层逐层添加首部，链路层再加尾部，每层的协议数据单元由本层控制信息与上一层的数据组成">
  <rect width="900" height="580" fill="#ffffff"/>
  <text x="24" y="30" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#2c3e50">封装：每下一层加一个首部</text>
  <text x="24" y="51" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8a97a4">本层 PDU ＝ 本层 PCI（首部）＋ 本层 SDU（上一层的 PDU）；链路层还要加尾部</text>
  <rect x="40" y="90" width="88" height="76" rx="5" fill="#f7f9fb" stroke="#e3e9ef"/>
  <text x="84" y="124" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#2c3e50" font-weight="600">应用层</text>
  <text x="84" y="142" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#8a97a4">第 5 层</text>
  <rect x="40" y="170" width="88" height="76" rx="5" fill="#f7f9fb" stroke="#e3e9ef"/>
  <text x="84" y="204" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#2c3e50" font-weight="600">传输层</text>
  <text x="84" y="222" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#8a97a4">第 4 层</text>
  <rect x="40" y="250" width="88" height="76" rx="5" fill="#f7f9fb" stroke="#e3e9ef"/>
  <text x="84" y="284" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#2c3e50" font-weight="600">网络层</text>
  <text x="84" y="302" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#8a97a4">第 3 层</text>
  <rect x="40" y="330" width="88" height="76" rx="5" fill="#f7f9fb" stroke="#e3e9ef"/>
  <text x="84" y="364" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#2c3e50" font-weight="600">数据链路层</text>
  <text x="84" y="382" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#8a97a4">第 2 层</text>
  <rect x="40" y="410" width="88" height="76" rx="5" fill="#f7f9fb" stroke="#e3e9ef"/>
  <text x="84" y="444" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#2c3e50" font-weight="600">物理层</text>
  <text x="84" y="462" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#8a97a4">第 1 层</text>
  <rect x="200" y="108" width="300" height="40" rx="3" fill="#eef3fb" stroke="#c3d6f0"/>
  <text x="350.0" y="133" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#2b5d9e" font-weight="600">数据</text>
  <rect x="184" y="188" width="16" height="40" rx="3" fill="#f0eefb" stroke="#d6cff0"/>
  <text x="192.0" y="213" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#5b4b8a" font-weight="600">H5</text>
  <rect x="200" y="188" width="300" height="40" rx="3" fill="#eef3fb" stroke="#c3d6f0"/>
  <text x="350.0" y="213" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#2b5d9e" font-weight="600">数据</text>
  <rect x="168" y="268" width="16" height="40" rx="3" fill="#fdf3ee" stroke="#f2c7b3"/>
  <text x="176.0" y="293" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#a2502f" font-weight="600">H4</text>
  <rect x="184" y="268" width="16" height="40" rx="3" fill="#f0eefb" stroke="#d6cff0"/>
  <text x="192.0" y="293" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#5b4b8a" font-weight="600">H5</text>
  <rect x="200" y="268" width="300" height="40" rx="3" fill="#eef3fb" stroke="#c3d6f0"/>
  <text x="350.0" y="293" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#2b5d9e" font-weight="600">数据</text>
  <rect x="136" y="348" width="16" height="40" rx="3" fill="#fbeaea" stroke="#f0c4c4"/>
  <text x="144.0" y="373" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#b23b3b" font-weight="600">H2</text>
  <rect x="152" y="348" width="16" height="40" rx="3" fill="#eaf7f1" stroke="#b7e0cd"/>
  <text x="160.0" y="373" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#2c6e54" font-weight="600">H3</text>
  <rect x="168" y="348" width="16" height="40" rx="3" fill="#fdf3ee" stroke="#f2c7b3"/>
  <text x="176.0" y="373" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#a2502f" font-weight="600">H4</text>
  <rect x="184" y="348" width="16" height="40" rx="3" fill="#f0eefb" stroke="#d6cff0"/>
  <text x="192.0" y="373" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#5b4b8a" font-weight="600">H5</text>
  <rect x="200" y="348" width="300" height="40" rx="3" fill="#eef3fb" stroke="#c3d6f0"/>
  <text x="350.0" y="373" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#2b5d9e" font-weight="600">数据</text>
  <rect x="500" y="348" width="16" height="40" rx="3" fill="#fbeaea" stroke="#f0c4c4"/>
  <text x="508.0" y="373" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.6" fill="#b23b3b" font-weight="600">T2</text>
  <line x1="136" y1="448" x2="516" y2="448" stroke="#b9c2cc" stroke-width="2"/>
  <text x="326" y="442" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#5b6b7b">1 0 1 1 0 0 1 0 1 1 0 …（电信号或光信号）</text>
  <text x="536" y="128" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#2c3e50">报文（message）</text>
  <text x="536" y="208" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#2c3e50">报文段（segment）</text>
  <text x="536" y="288" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#2c3e50">分组 / 数据报（packet / datagram）</text>
  <text x="536" y="368" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#2c3e50">帧（frame）</text>
  <text x="536" y="448" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#2c3e50">比特（bit）</text>
  <rect x="24" y="496" width="852" height="72" rx="8" fill="#f7f9fb" stroke="#e3e9ef"/>
  <text x="44" y="518" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.8" fill="#2c3e50" font-weight="600">接收方是逆过程</text>
  <text x="44" y="538" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#5b6b7b">物理层收下比特流 → 链路层验帧、去首尾 → 网络层查目的 IP、去首部 → 传输层按端口号交付进程 → 应用层拿到原始报文。</text>
  <text x="44" y="558" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#8a97a4">每层只拆自己的首部，不关心上层内容；对等层看到的始终是对方发来的同层 PDU。</text>
</svg>
