<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-label="OSI 七层模型、TCP/IP 四层模型与五层教学模型对照图">
  <rect width="720" height="470" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#2c3e50">OSI 七层模型、TCP/IP 四层模型与五层教学模型对照</text>

  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <rect x="40" y="42" width="150" height="24" rx="5" fill="#f4f5f7" stroke="#dfe4ea"/>
    <text x="115" y="58" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5b6b7b">OSI 七层模型</text>
    <rect x="220" y="42" width="150" height="24" rx="5" fill="#f4f5f7" stroke="#dfe4ea"/>
    <text x="295" y="58" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5b6b7b">TCP/IP 四层模型</text>
    <rect x="400" y="42" width="170" height="24" rx="5" fill="#f4f5f7" stroke="#dfe4ea"/>
    <text x="485" y="58" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5b6b7b">五层教学模型</text>
    <text x="660" y="58" text-anchor="middle" font-size="12.5" font-weight="600" fill="#8a97a4">数据单元</text>
  </g>

  <!-- 横向分界虚线：三个模型的层边界在此对齐 -->
  <line x1="40" y1="217" x2="700" y2="217" stroke="#e8edf2" stroke-width="1" stroke-dasharray="4 5"/>
  <line x1="40" y1="317" x2="700" y2="317" stroke="#e8edf2" stroke-width="1" stroke-dasharray="4 5"/>

  <!-- OSI 七层 -->
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" text-anchor="middle">
    <rect x="40" y="70" width="150" height="44" rx="6" fill="#eaf7f1" stroke="#b7e0cd"/><text x="115" y="97" fill="#2c6e54">应用层</text>
    <rect x="40" y="120" width="150" height="44" rx="6" fill="#eef9f4" stroke="#c8e6d8"/><text x="115" y="147" fill="#2c6e54">表示层</text>
    <rect x="40" y="170" width="150" height="44" rx="6" fill="#f3fbf7" stroke="#d5ece1"/><text x="115" y="197" fill="#2c6e54">会话层</text>
    <rect x="40" y="220" width="150" height="44" rx="6" fill="#eef3fb" stroke="#c3d6f0"/><text x="115" y="247" fill="#2b5d9e">传输层</text>
    <rect x="40" y="270" width="150" height="44" rx="6" fill="#fdf5e6" stroke="#f0d9a8"/><text x="115" y="297" fill="#9a6b16">网络层</text>
    <rect x="40" y="320" width="150" height="44" rx="6" fill="#f5effb" stroke="#dcc9f0"/><text x="115" y="347" fill="#6b3fa0">数据链路层</text>
    <rect x="40" y="370" width="150" height="44" rx="6" fill="#f4f5f7" stroke="#dfe4ea"/><text x="115" y="397" fill="#5b6b7b">物理层</text>
  </g>

  <!-- TCP/IP 四层 -->
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="220" y="70" width="150" height="144" rx="6" fill="#eaf7f1" stroke="#b7e0cd"/>
    <text x="295" y="136" font-size="13" fill="#2c6e54">应用层</text>
    <text x="295" y="156" font-size="10.5" fill="#6a9c86">HTTP、FTP、SMTP、DNS</text>
    <rect x="220" y="220" width="150" height="44" rx="6" fill="#eef3fb" stroke="#c3d6f0"/>
    <text x="295" y="241" font-size="13" fill="#2b5d9e">传输层</text>
    <text x="295" y="257" font-size="10.5" fill="#6a86ac">TCP、UDP</text>
    <rect x="220" y="270" width="150" height="44" rx="6" fill="#fdf5e6" stroke="#f0d9a8"/>
    <text x="295" y="291" font-size="13" fill="#9a6b16">网际层</text>
    <text x="295" y="307" font-size="10.5" fill="#b08a3c">IP、ICMP、ARP</text>
    <rect x="220" y="320" width="150" height="94" rx="6" fill="#f5effb" stroke="#dcc9f0"/>
    <text x="295" y="361" font-size="13" fill="#6b3fa0">网络接口层</text>
    <text x="295" y="381" font-size="10.5" fill="#8f6cb8">以太网、Wi-Fi、PPP</text>
  </g>

  <!-- 五层教学模型 -->
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="400" y="70" width="170" height="144" rx="6" fill="#eaf7f1" stroke="#b7e0cd"/>
    <text x="485" y="136" font-size="13" fill="#2c6e54">应用层</text>
    <text x="485" y="156" font-size="10.5" fill="#6a9c86">合并 OSI 的应用、表示、会话三层</text>
    <rect x="400" y="220" width="170" height="44" rx="6" fill="#eef3fb" stroke="#c3d6f0"/>
    <text x="485" y="241" font-size="13" fill="#2b5d9e">传输层</text>
    <text x="485" y="257" font-size="10.5" fill="#6a86ac">进程到进程</text>
    <rect x="400" y="270" width="170" height="44" rx="6" fill="#fdf5e6" stroke="#f0d9a8"/>
    <text x="485" y="291" font-size="13" fill="#9a6b16">网络层</text>
    <text x="485" y="307" font-size="10.5" fill="#b08a3c">主机到主机、路由选择</text>
    <rect x="400" y="320" width="170" height="44" rx="6" fill="#f5effb" stroke="#dcc9f0"/>
    <text x="485" y="341" font-size="13" fill="#6b3fa0">数据链路层</text>
    <text x="485" y="357" font-size="10.5" fill="#8f6cb8">相邻结点、成帧与差错控制</text>
    <rect x="400" y="370" width="170" height="44" rx="6" fill="#f4f5f7" stroke="#dfe4ea"/>
    <text x="485" y="391" font-size="13" fill="#5b6b7b">物理层</text>
    <text x="485" y="407" font-size="10.5" fill="#8a97a4">比特传输</text>
  </g>

  <!-- 数据单元 -->
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" text-anchor="middle" fill="#7f8c9a">
    <text x="650" y="142">报文</text>
    <text x="650" y="246">报文段</text>
    <text x="650" y="296">分组</text>
    <text x="650" y="346">帧</text>
    <text x="650" y="396">比特</text>
  </g>

  <text x="360" y="440" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#8a97a4">OSI 是理论上的参考模型，TCP/IP 是互联网事实标准；五层模型取两者之长，答题时以五层为准</text>
  <text x="360" y="460" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#8a97a4">对等层之间靠协议通信，相邻层之间靠接口与服务调用</text>
</svg>
