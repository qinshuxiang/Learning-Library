<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" role="img" aria-label="集线器、交换机、路由器三种设备的作用对比：集线器所有端口共享介质会冲突，交换机每端口独立不冲突，路由器连接两个不同网络">
  <rect width="900" height="580" fill="#ffffff"/>
  <text x="24" y="30" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="16" fill="#2c3e50" font-weight="600">集线器、交换机与路由器</text>
  <text x="24" y="51" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#8a97a4">前两者把结点连成「一个」网络，路由器把「多个」网络连起来</text>
  <defs>
  <marker id="g1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3f8f6b"/></marker>
  <marker id="r1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b23b3b"/></marker>
  <marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b5d9e"/></marker>
  </defs>
  <rect x="24" y="76" width="252" height="306" rx="10" fill="#f7f9fb" stroke="#e3e9ef" stroke-width="1"/>
  <rect x="40" y="90" width="4" height="16" rx="2" fill="#b23b3b" stroke="none" stroke-width="1"/>
  <text x="52" y="103" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#b23b3b" font-weight="600">集线器（HUB）</text>
  <text x="52" y="121" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.8" fill="#8a97a4">共享介质，会冲突</text>
  <rect x="312" y="76" width="252" height="306" rx="10" fill="#f7f9fb" stroke="#e3e9ef" stroke-width="1"/>
  <rect x="328" y="90" width="4" height="16" rx="2" fill="#2c6e54" stroke="none" stroke-width="1"/>
  <text x="340" y="103" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2c6e54" font-weight="600">交换机（Switch）</text>
  <text x="340" y="121" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.8" fill="#8a97a4">每端口独立，不冲突</text>
  <rect x="600" y="76" width="252" height="306" rx="10" fill="#f7f9fb" stroke="#e3e9ef" stroke-width="1"/>
  <rect x="616" y="90" width="4" height="16" rx="2" fill="#2b5d9e" stroke="none" stroke-width="1"/>
  <text x="628" y="103" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#2b5d9e" font-weight="600">路由器（Router）</text>
  <text x="628" y="121" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.8" fill="#8a97a4">连接不同网络</text>
  <rect x="50" y="148" width="40" height="28" rx="3" fill="#ffffff" stroke="#e3e9ef" stroke-width="1"/>
  <line x1="57" y1="162" x2="83" y2="162" stroke="#dfe4ea" stroke-width="1"/>
  <rect x="130" y="148" width="40" height="28" rx="3" fill="#ffffff" stroke="#e3e9ef" stroke-width="1"/>
  <line x1="137" y1="162" x2="163" y2="162" stroke="#dfe4ea" stroke-width="1"/>
  <rect x="210" y="148" width="40" height="28" rx="3" fill="#ffffff" stroke="#e3e9ef" stroke-width="1"/>
  <line x1="217" y1="162" x2="243" y2="162" stroke="#dfe4ea" stroke-width="1"/>
  <rect x="70" y="210" width="160" height="24" rx="4" fill="#fbeaea" stroke="#f0c4c4" stroke-width="1"/>
  <text x="150" y="226" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.8" fill="#b23b3b" font-weight="600">HUB</text>
  <line x1="70" y1="176" x2="90" y2="210" stroke="#e6c9c9" stroke-width="1.2"/>
  <line x1="150" y1="176" x2="150" y2="210" stroke="#e6c9c9" stroke-width="1.2"/>
  <line x1="230" y1="176" x2="210" y2="210" stroke="#e6c9c9" stroke-width="1.2"/>
  <line x1="80" y1="196" x2="136" y2="204" stroke="#b23b3b" stroke-width="1.6" marker-end="url(#r1)"/>
  <line x1="220" y1="196" x2="164" y2="204" stroke="#b23b3b" stroke-width="1.6" marker-end="url(#r1)"/>
  <text x="150" y="190" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9" fill="#b23b3b" font-weight="600">同时发送 → 撞车</text>
  <text x="150" y="258" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.2" fill="#8a97a4">数据相互叠加，两边的都作废</text>
  <text x="42" y="292" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#5b6b7b">所有端口共享同一条传输介质</text>
  <text x="42" y="313" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#5b6b7b">同一时刻只允许一台主机发送</text>
  <text x="42" y="334" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#5b6b7b">冲突后要退避重发，效率很低</text>
  <text x="42" y="355" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#5b6b7b">已被淘汰，只在旧资料里出现</text>
  <rect x="338" y="148" width="40" height="28" rx="3" fill="#ffffff" stroke="#e3e9ef" stroke-width="1"/>
  <line x1="345" y1="162" x2="371" y2="162" stroke="#dfe4ea" stroke-width="1"/>
  <rect x="418" y="148" width="40" height="28" rx="3" fill="#ffffff" stroke="#e3e9ef" stroke-width="1"/>
  <line x1="425" y1="162" x2="451" y2="162" stroke="#dfe4ea" stroke-width="1"/>
  <rect x="498" y="148" width="40" height="28" rx="3" fill="#ffffff" stroke="#e3e9ef" stroke-width="1"/>
  <line x1="505" y1="162" x2="531" y2="162" stroke="#dfe4ea" stroke-width="1"/>
  <rect x="358" y="210" width="160" height="24" rx="4" fill="#eaf7f1" stroke="#b7e0cd" stroke-width="1"/>
  <text x="438" y="226" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.8" fill="#2c6e54" font-weight="600">SWITCH</text>
  <line x1="358" y1="176" x2="358" y2="210" stroke="#b7e0cd" stroke-width="1.4"/>
  <line x1="438" y1="176" x2="438" y2="210" stroke="#b7e0cd" stroke-width="1.4"/>
  <line x1="518" y1="176" x2="518" y2="210" stroke="#b7e0cd" stroke-width="1.4"/>
  <line x1="358" y1="196" x2="408" y2="204" stroke="#3f8f6b" stroke-width="1.6" marker-end="url(#g1)"/>
  <line x1="518" y1="196" x2="468" y2="204" stroke="#3f8f6b" stroke-width="1.6" marker-end="url(#g1)"/>
  <text x="438" y="190" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9" fill="#2c6e54" font-weight="600">同时发送 → 互不干扰</text>
  <text x="372" y="258" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9" fill="#2c6e54" font-weight="600">✓ 都收到</text>
  <text x="510" y="258" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9" fill="#2c6e54" font-weight="600">✓ 都收到</text>
  <text x="330" y="292" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#5b6b7b">每个端口一条独立通道（全双工）</text>
  <text x="330" y="313" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#5b6b7b">多对端口可同时收发，互不冲突</text>
  <text x="330" y="334" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#5b6b7b">内部组网的主力设备，可级联</text>
  <text x="330" y="355" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#5b6b7b">「交换」指按端口转发，不是换线路</text>
  <rect x="614" y="168" width="70" height="52" rx="6" fill="#ffffff" stroke="#c3d6f0" stroke-width="1"/>
  <text x="649" y="190" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#2b5d9e" font-weight="600">网络 A</text>
  <text x="649" y="205" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="7.4" fill="#8a97a4">192.168.1.0/24</text>
  <rect x="756" y="168" width="70" height="52" rx="6" fill="#ffffff" stroke="#c3d6f0" stroke-width="1"/>
  <text x="791" y="190" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10" fill="#2b5d9e" font-weight="600">网络 B</text>
  <text x="791" y="205" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="7.4" fill="#8a97a4">192.168.2.0/24</text>
  <rect x="696" y="182" width="48" height="24" rx="4" fill="#eef3fb" stroke="#c3d6f0" stroke-width="1"/>
  <text x="720" y="198" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9" fill="#2b5d9e" font-weight="600">路由器</text>
  <line x1="684" y1="194" x2="695" y2="194" stroke="#c3d6f0" stroke-width="1.3" marker-end="url(#b1)"/>
  <line x1="744" y1="194" x2="755" y2="194" stroke="#c3d6f0" stroke-width="1.3" marker-end="url(#b1)"/>
  <text x="726" y="252" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.8" fill="#8a97a4">A → B 的包：查表选下一跳</text>
  <text x="618" y="292" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#5b6b7b">连接两个或多个不同的网络</text>
  <text x="618" y="313" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#5b6b7b">按目的网络地址查表选路</text>
  <text x="618" y="334" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#5b6b7b">不改变 IP 地址，只换链路帧</text>
  <text x="618" y="355" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#5b6b7b">互连网与互联网的粘结剂</text>
  <rect x="24" y="402" width="852" height="154" rx="10" fill="#ffffff" stroke="#e3e9ef" stroke-width="1"/>
  <text x="44" y="426" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#2c3e50" font-weight="600">家用路由器不是「一个路由器」</text>
  <rect x="52" y="450" width="168" height="26" rx="5" fill="#f0f2f5" stroke="#cdd5de" stroke-width="1"/>
  <line x1="70" y1="450" x2="60" y2="432" stroke="#cdd5de" stroke-width="2"/>
  <line x1="200" y1="450" x2="210" y2="432" stroke="#cdd5de" stroke-width="2"/>
  <rect x="66" y="454" width="16" height="8" rx="1.5" fill="#eef3fb" stroke="#c3d6f0" stroke-width="1"/>
  <rect x="92" y="454" width="16" height="8" rx="1.5" fill="#eef3fb" stroke="#c3d6f0" stroke-width="1"/>
  <rect x="118" y="454" width="16" height="8" rx="1.5" fill="#eef3fb" stroke="#c3d6f0" stroke-width="1"/>
  <rect x="144" y="454" width="16" height="8" rx="1.5" fill="#eef3fb" stroke="#c3d6f0" stroke-width="1"/>
  <rect x="170" y="454" width="20" height="8" rx="1.5" fill="#fdf3ee" stroke="#f2c7b3" stroke-width="1"/>
  <text x="76" y="494" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.5" fill="#2b5d9e">LAN 口 ×4</text>
  <text x="160" y="494" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.5" fill="#a2502f">WAN 口</text>
  <text x="136" y="516" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="8.5" fill="#8a97a4">天线：无线接入点（AP）</text>
  <text x="244" y="446" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.6" fill="#2c3e50">= 交换机 + 路由器 + 若干附加功能</text>
  <circle cx="254" cy="464" r="3" fill="#2b5d9e" stroke="none" stroke-width="1"/>
  <text x="266" y="468" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#2b5d9e" font-weight="600">LAN 口与 Wi-Fi</text>
  <text x="452" y="468" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#5b6b7b">：交换机功能：把家里的设备连成同一张计算机网络</text>
  <circle cx="254" cy="490" r="3" fill="#a2502f" stroke="none" stroke-width="1"/>
  <text x="266" y="494" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#a2502f" font-weight="600">WAN 口</text>
  <text x="452" y="494" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#5b6b7b">：路由器功能：把这张网络接到运营商，从而接入互联网</text>
  <circle cx="254" cy="516" r="3" fill="#2c6e54" stroke="none" stroke-width="1"/>
  <text x="266" y="520" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#2c6e54" font-weight="600">NAT、DHCP、AP</text>
  <text x="452" y="520" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#5b6b7b">：家用路由器额外集成；课程里的「路由器」只指路由转发那部分</text>
  <text x="44" y="542" text-anchor="start" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.2" fill="#8a97a4">记忆：端口连的是「同一张网」就是交换机行为，跨到「另一张网」才是路由器行为。</text>
</svg>
