<text x="30" y="633" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#5b6b7b">读法：① 先看码元中间——必变的是曼彻斯特、差分曼彻斯特，其余三种中间不变；② 再看码元起点——起点跳为 0、不跳为 1 的是 NRZI 与差分曼彻斯特。</text>
<text x="30" y="653" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#5b6b7b">③ 剩下 NRZ、RZ 只比电平：低 0 高 1；RZ 每个 1 回零，故有同步跳变，但带宽翻倍。</text>
<text x="30" y="674" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="9.5" fill="#8a97a4">约定：曼彻斯特按 IEEE 802.3 绘制（0 = 高→低，1 = 低→高；G.E. Thomas 相反，两套只差一次极性反转）；NRZI 按 NRZ-S（0 = 跳变，1 = 不变，同 HDLC/USB）。</text>
</svg>