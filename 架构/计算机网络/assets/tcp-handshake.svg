<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-label="TCP 三次握手时序图">
  <defs>
    <marker id="ths-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3aa76d"/>
    </marker>
    <marker id="ths-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3a7bd5"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#2c3e50">TCP 三次握手（three-way handshake）</text>

  <rect x="80" y="44" width="140" height="30" rx="6" fill="#eaf7f1" stroke="#b7e0cd"/>
  <text x="150" y="64" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="600" fill="#2c6e54">客户端</text>
  <rect x="500" y="44" width="140" height="30" rx="6" fill="#eef3fb" stroke="#c3d6f0"/>
  <text x="570" y="64" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="600" fill="#2b5d9e">服务器</text>

  <line x1="150" y1="74" x2="150" y2="430" stroke="#c8d2db" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="570" y1="74" x2="570" y2="430" stroke="#c8d2db" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="150" cy="88" r="3.2" fill="#3aa76d"/>
  <circle cx="570" cy="88" r="3.2" fill="#3a7bd5"/>

  <rect x="30" y="86" width="106" height="24" rx="12" fill="#f4f5f7" stroke="#dfe4ea"/>
  <text x="83" y="102" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="12" fill="#5b6b7b">CLOSED</text>
  <rect x="584" y="86" width="106" height="24" rx="12" fill="#f4f5f7" stroke="#dfe4ea"/>
  <text x="637" y="102" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="12" fill="#5b6b7b">CLOSED</text>

  <line x1="150" y1="100" x2="566" y2="138" stroke="#3aa76d" stroke-width="1.8" marker-end="url(#ths-g)"/>
  <text x="358" y="112" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#2c6e54">① SYN=1, seq=x</text>

  <rect x="30" y="140" width="106" height="24" rx="12" fill="#eaf7f1" stroke="#b7e0cd"/>
  <text x="83" y="156" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="12" fill="#2c6e54">SYN-SENT</text>

  <line x1="570" y1="176" x2="154" y2="214" stroke="#3a7bd5" stroke-width="1.8" marker-end="url(#ths-b)"/>
  <text x="362" y="188" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#2b5d9e">② SYN=1, ACK=1, seq=y, ack=x+1</text>

  <rect x="584" y="176" width="106" height="24" rx="12" fill="#eef3fb" stroke="#c3d6f0"/>
  <text x="637" y="192" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="12" fill="#2b5d9e">LISTEN</text>
  <rect x="584" y="232" width="106" height="24" rx="12" fill="#eef3fb" stroke="#c3d6f0"/>
  <text x="637" y="248" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="12" fill="#2b5d9e">SYN-RCVD</text>

  <line x1="150" y1="256" x2="566" y2="294" stroke="#3aa76d" stroke-width="1.8" marker-end="url(#ths-g)"/>
  <text x="358" y="268" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#2c6e54">③ ACK=1, seq=x+1, ack=y+1</text>

  <rect x="30" y="272" width="106" height="24" rx="12" fill="#e6f6ef" stroke="#9fd6bd"/>
  <text x="83" y="288" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="600" fill="#24674d">ESTABLISHED</text>
  <rect x="584" y="302" width="106" height="24" rx="12" fill="#e6f6ef" stroke="#9fd6bd"/>
  <text x="637" y="318" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="600" fill="#24674d">ESTABLISHED</text>

  <rect x="150" y="336" width="420" height="34" rx="6" fill="#f3fbf7" stroke="#cfeade"/>
  <text x="360" y="358" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#2c6e54">连接建立完成，双方可双向传输数据（第三次握手起可携带数据）</text>

  <text x="360" y="404" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8a97a4">③ 的 ack=y+1 让服务器确认「客户端已收到我的 SYN」，至此双方各确认一次「对方能收、我能发」</text>
  <text x="360" y="428" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8a97a4">时间沿垂直方向自上而下推进；前两次握手不携带应用数据</text>
</svg>
