<div id="app">
  <!-- 左侧栏 -->
  <aside id="sidebar">
    <div id="searchbox">
      <svg class="sicon" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input id="search" type="search" placeholder="搜索文件名 / 正文…" title="站内搜索（快捷键：Ctrl / Cmd + F；再按一次交还浏览器查找）" autocomplete="off" spellcheck="false">
      <kbd id="search-kbd" title="站内搜索快捷键">Ctrl F</kbd>
      <span id="search-clear" title="清空">×</span>
    </div>
    <div id="tree"></div>
    <div id="search-results" hidden></div>
  </aside>

  <!-- 中间正文 -->
  <main id="content">
    <div class="content-scroll">
      <!-- 搜索结果导航条（始终位于正文之前，sticky 钉在视口顶部） -->
      <nav id="hl-nav" role="region" aria-label="搜索结果导航" hidden>
        <span class="hl-tag">搜索</span>
        <span id="hl-count">0 / 0</span>
        <button id="hl-prev" type="button" title="上一个匹配（快捷键：Shift+Enter 或 Alt+↑）">‹ 上一个</button>
        <button id="hl-next" type="button" title="下一个匹配（快捷键：Enter 或 Alt+↓）">下一个 ›</button>
        <button id="hl-close" type="button" title="退出搜索高亮（清空搜索框亦可）">退出</button>
      </nav>
      <article id="doc" class="markdown-body"></article>
      <footer id="foot">
        <span id="foot-path"></span>
        <span id="foot-meta"></span>
      </footer>
    </div>
  </main>

  <!-- 右侧目录（Table of Contents，由正文标题自动提取） -->
  <aside id="toc" aria-label="文章目录">
    <div id="toc-head">
      <span id="toc-title">目录</span>
      <button id="toc-close" type="button" title="收起目录" aria-label="收起目录">×</button>
    </div>
    <nav id="toc-list"></nav>
  </aside>
</div>

<!-- 窄屏 / 目录收起时的悬浮按钮 -->
<button id="toc-fab" type="button" title="打开目录" aria-label="打开目录">
  <svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true" fill="currentColor">
    <path d="M2 3.5h12v1.2H2zM4.4 7.4h9.6v1.2H4.4zM6.8 11.3h7.2v1.2H6.8z"/>
  </svg>
</button>
<div id="toc-mask" hidden></div>
