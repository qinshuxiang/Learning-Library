name: Deploy to GitHub Pages

# 每次推送到 main 分支时自动构建学习库并发布到 GitHub Pages。
# 也可在仓库 Actions 页面手动点击 "Run workflow" 触发。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 最小权限：只读取代码、写入 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一次部署，排队执行而非互相打断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建学习库
        run: npm run build

      - name: 准备 Pages 产物
        run: |
          mkdir -p _site
          cp 学习库.html _site/index.html
          touch _site/.nojekyll
          ls -lh _site

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
